<div class="min-h-screen flex items-center justify-center bg-[var(--nw-brand-sidebar-bg)] p-4">
  <div
    class="w-full max-w-md bg-[var(--nw-overlay-bg)] border border-[var(--p-content-border-color)] rounded-xl p-10 flex flex-col gap-6"
  >
    <!-- Theme toggle en esquina superior derecha -->
    <div class="absolute top-4 right-4">
      <app-theme-toggle />
    </div>

    <div class="flex flex-col items-center gap-2 text-center">
      <img src="notesown-icon.svg" alt="Notesown" class="w-14 h-14" />
      <h1 class="text-2xl font-bold m-0 text-[var(--p-text-color)]">Notesown</h1>
      <p class="text-sm text-[var(--p-text-muted-color)] m-0">
        {{ mode() === 'login' ? 'Bienvenido de vuelta' : 'Crea tu cuenta' }}
      </p>
    </div>

    <form class="flex flex-col gap-6" (ngSubmit)="submit()" #loginForm="ngForm">
      @if (errorMessage()) {
        <p-message severity="error" [text]="errorMessage()" styleClass="w-full" />
      }

      <p-floatlabel class="w-full">
        <input
          id="email"
          pInputText
          type="email"
          name="email"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
          autocomplete="email"
          required
          class="w-full"
          data-testid="input-email"
        />
        <label for="email">Correo electrónico</label>
      </p-floatlabel>

      <p-floatlabel class="w-full">
        <p-password
          inputId="password"
          name="password"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          [feedback]="mode() === 'register'"
          [toggleMask]="true"
          [fluid]="true"
          autocomplete="{{ mode() === 'login' ? 'current-password' : 'new-password' }}"
          required
          data-testid="input-password"
        />
        <label for="password">Contraseña</label>
      </p-floatlabel>

      <p-button
        type="submit"
        [label]="mode() === 'login' ? 'Iniciar sesión' : 'Registrarse'"
        [loading]="isLoading()"
        [fluid]="true"
        data-testid="btn-submit"
      />
    </form>

    <div class="flex items-center justify-center gap-1 text-sm text-[var(--p-text-muted-color)]">
      <span>{{ mode() === 'login' ? '¿No tienes cuenta?' : '¿Ya tienes cuenta?' }}</span>
      <p-button
        [label]="mode() === 'login' ? 'Crear cuenta' : 'Iniciar sesión'"
        link
        (onClick)="toggleMode()"
        data-testid="btn-toggle-mode"
      />
    </div>
  </div>
</div>
